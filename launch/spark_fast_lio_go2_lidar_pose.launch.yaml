---
launch:
  - arg: {name: start_rviz, default: 'false', description: automatically start rviz}
  - arg: {name: map_frame, default: 'odom'}
  # Co-Nav consumes odom -> base_link and then applies a LiDAR->camera extrinsic.
  # For this test profile, publish the FAST-LIO LiDAR pose under the child frame
  # name base_link so the upstream Co-Nav pose convention stays unchanged.
  - arg: {name: lidar_frame, default: 'base_link'}
  - arg: {name: imu_frame, default: 'utlidar_imu'}
  - arg: {name: config_path, default: $(find-pkg-share spark_fast_lio)/config/velodyne_mit.yaml}
  - arg: {name: rviz_path, default: $(find-pkg-share spark_fast_lio)/rviz/velodyne_mit.rviz}

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown

      remap:
        - {from: 'lidar', to: '/utlidar/cloud'}
        - {from: 'imu', to: '/utlidar/imu'}

      param:
        - name: "common.lidar_frame"
          value: "$(var lidar_frame)"
        - name: "common.imu_frame"
          value: "$(var imu_frame)"
        - name: "common.map_frame"
          value: "$(var map_frame)"
        - name: "common.base_frame"
          value: ""
        - name: "common.visualization_frame"
          value: "lidar"
        - from: $(var config_path)

  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: rviz
      output: screen
      args: >
        -d $(var rviz_path)
