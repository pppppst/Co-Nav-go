---
launch:
  - arg: {name: start_rviz, default: 'false', description: automatically start rviz}
  - arg: {name: map_frame, default: 'odom'}
  - arg: {name: base_frame, default: 'base_link'}
  - arg: {name: lidar_frame, default: 'utlidar_lidar'}
  - arg: {name: imu_frame, default: 'utlidar_imu'}
  - arg: {name: config_path, default: $(find-pkg-share spark_fast_lio)/config/velodyne_mit.yaml}
  - arg: {name: rviz_path, default: $(find-pkg-share spark_fast_lio)/rviz/velodyne_mit.rviz}

  - node:
      # Static LiDAR pose in the Go2 body/base frame.
      # x y z roll pitch yaw parent child
      pkg: tf2_ros
      exec: static_transform_publisher
      name: go2_lidar_static_tf
      output: screen
      args: "0.1710 0.0 0.0908 0.0 0.0 0.0 $(var base_frame) $(var lidar_frame)"

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown

      remap:
        - {from: 'lidar', to: '/utlidar/cloud'}
        - {from: 'imu', to: '/utlidar/imu'}

      param:
        - name: "common.lidar_frame"
          value: "$(var lidar_frame)"
        - name: "common.imu_frame"
          value: "$(var imu_frame)"
        - name: "common.map_frame"
          value: "$(var map_frame)"
        - name: "common.base_frame"
          value: "$(var base_frame)"
        - name: "common.visualization_frame"
          value: "base"
        - from: $(var config_path)

  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: rviz
      output: screen
      args: >
        -d $(var rviz_path)
